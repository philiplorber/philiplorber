<title>Andamio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: two working panes — the conversation (left) that maps words into a spec, and a live device preview (right) of the platform being built. */
:root{
  --paper:#ECEFF3; --panel:#FFFFFF; --ink:#131922; --muted:#586374; --line:#D3D9E1;
  --accent:#2346D8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB; --ok:#1C7A4B; --warn:#9A5800;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1217; --panel:#161C24; --ink:#E6EBF2; --muted:#98A3B4; --line:#29313C;
  --accent:#8199FF; --accent-ink:#0E1217; --accent-soft:#1E2848; --ok:#52C48A; --warn:#E3A44A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1217; --panel:#161C24; --ink:#E6EBF2; --muted:#98A3B4; --line:#29313C;
  --accent:#8199FF; --accent-ink:#0E1217; --accent-soft:#1E2848; --ok:#52C48A; --warn:#E3A44A; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px}
.mark{width:26px;height:26px;align-self:center;flex:none}
.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:transparent}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.badge.on i{background:var(--ok)}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:13px}
.tbtn:hover{border-color:var(--ink)}
.tbtn:disabled{opacity:.4;cursor:default}

main{display:grid;grid-template-columns:minmax(340px,430px) 1fr;min-height:0}
.chat{display:grid;grid-template-rows:1fr auto;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.log{overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.msg{max-width:100%;min-width:0}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:85%}
.msg.ai .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.msg.ai p{margin:0 0 6px}
.changes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chg{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.chg::before{content:"→ ";color:var(--accent)}
.q{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.q h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
.q .hint{color:var(--muted);font-size:13px;margin:-4px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:14px;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"]::before{content:"✓";font-weight:700}
.sw{display:inline-flex}
.sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);margin-left:-4px}
.sw i:first-child{margin-left:0}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.go{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.blind{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:0 10px 10px 0;margin-top:8px}
.blind b{display:block;font-size:13px;color:var(--warn);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.blind ul{margin:0;padding-left:18px}
.think{color:var(--muted);font-style:italic;display:flex;gap:10px;align-items:center}
.composer{border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:10px 12px;font:inherit;min-height:44px;max-height:140px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 16px;height:44px;font-weight:600}

.stage{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr}
.stagebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stagebar .note{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.canvas{overflow:auto;padding:4px 20px 28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 18px 50px -24px rgba(10,20,40,.35);max-width:100%;transition:width .25s ease}
.device.desk{width:100%;max-width:1080px}
.device.mob{width:390px}
.chrome{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chrome i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.chrome .url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper);border-radius:6px;padding:3px 10px;margin-left:6px}

/* ---- Plano (spec) ---- */
.plan{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.plan h2{font-family:var(--f-display);font-size:24px;margin:0}
.plan .lead{color:var(--muted);margin:0;max-width:65ch}
.maptbl{width:100%;border-collapse:collapse;font-size:14px}
.maptbl th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px}
.maptbl td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.maptbl td:first-child{width:40%;font-style:italic}
pre.json{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:12.5px;overflow:auto;max-height:420px;margin:0}

/* ---- Preview platform (pv-*) uses colors chosen by the user ---- */
.pv{background:var(--pbg);color:var(--pfg);font-family:var(--f-body);min-height:560px;display:flex;flex-direction:column}
.pv.side{flex-direction:row}
.pv-head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--phead);color:var(--pheadfg);flex-wrap:wrap}
.pv-logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;min-width:0}
.pv-logo i{width:32px;height:32px;border-radius:9px;background:var(--a);color:var(--afg);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.pv-nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin-left:auto;max-width:100%}
.pv-nav button{border:0;background:transparent;color:inherit;padding:7px 11px;border-radius:8px;font-size:13.5px;white-space:nowrap;opacity:.85}
.pv-nav button[aria-current="page"]{background:color-mix(in srgb,var(--pheadfg) 16%,transparent);opacity:1;font-weight:600}
.pv-side{width:210px;flex:none;background:var(--phead);color:var(--pheadfg);padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.pv-side .pv-nav{flex-direction:column;margin:0;overflow:visible}
.pv-side .pv-nav button{text-align:left;display:flex;gap:10px;align-items:center}
.pv-body{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;gap:20px}
.pv-tabbar{display:flex;justify-content:space-around;border-top:1px solid var(--pline);background:var(--pcard);padding:6px 4px 8px;position:sticky;bottom:0}
.pv-tabbar button{border:0;background:none;color:var(--pmuted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 6px;min-width:0}
.pv-tabbar button[aria-current="page"]{color:var(--p)}
.pv-tabbar svg,.pv-side svg,.pv-card svg{width:20px;height:20px;flex:none}
.pv-hero{border-radius:16px;padding:26px;background:var(--p);color:var(--pfgon);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pv-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid color-mix(in srgb,var(--a) 70%,transparent)}
.pv-hero h1{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.1;letter-spacing:-.02em;max-width:22ch;text-wrap:balance;position:relative}
.pv-hero p{margin:0;opacity:.9;max-width:48ch;position:relative}
.pv-cta{align-self:flex-start;border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--a);color:var(--afg);position:relative}
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pv-stat{background:var(--pcard);border:1px solid var(--pline);border-radius:12px;padding:12px 14px}
.pv-stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.pv-stat span{font-size:12px;color:var(--pmuted);text-transform:uppercase;letter-spacing:.05em}
.pv-h2{margin:0;font-family:var(--f-display);font-size:20px}
.pv-sub{margin:-12px 0 0;color:var(--pmuted);font-size:13.5px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pv-card{background:var(--pcard);border:1px solid var(--pline);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit}
button.pv-card:hover{border-color:var(--p)}
.pv-card svg{color:var(--p)}
.pv-card b{font-size:15px}
.pv-card span{font-size:13px;color:var(--pmuted)}
.pv-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--pfg)}
.pv-ex{font-family:var(--f-mono);font-size:11px;color:var(--pmuted)}
.pv-tblwrap{overflow-x:auto;border:1px solid var(--pline);border-radius:12px;background:var(--pcard)}
.pv-tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.pv-tbl th,.pv-tbl td{padding:7px 9px;border-bottom:1px solid var(--pline);text-align:left;white-space:nowrap}
.pv-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--pmuted)}
.pv-slot{border:1px solid var(--pline);background:transparent;color:var(--pfg);border-radius:7px;padding:4px 8px;font-size:12px;min-width:70px}
.pv-slot.busy{background:color-mix(in srgb,var(--pfg) 8%,transparent);color:var(--pmuted);cursor:not-allowed;border-style:dashed}
.pv-slot.mine{background:var(--a);color:var(--afg);border-color:var(--a);font-weight:700}
.pv-slot.free:hover{border-color:var(--p)}
.pv-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pv-btn{border:0;border-radius:9px;padding:8px 14px;font-weight:600;background:var(--p);color:var(--pfgon)}
.pv-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pv-gal div{aspect-ratio:4/3;border-radius:10px;max-width:100%}
.pv-input{border:1px solid var(--pline);background:var(--pbg);color:var(--pfg);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
/* ---- Business panel: unified inbox & channels ---- */
.pv .chb,.chb{color:#fff}
.chb{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;color:#fff;font-size:10px;font-weight:700;font-family:var(--f-mono);flex:none;letter-spacing:0}
.pv-g{display:flex;flex-direction:column;gap:2px}
.pv-gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;padding:10px 11px 4px}
.pv-cnt{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--a);color:var(--afg);border-radius:999px;padding:1px 7px}
.pv.side.compact{flex-direction:column}
.pv.side.compact .pv-side{width:auto;padding:10px 12px;gap:8px}
.pv.side.compact .pv-nav{flex-direction:row;overflow-x:auto}
.pv.compact .pv-g{flex-direction:row}
.pv-topbar{border-bottom:1px solid var(--pline);padding-bottom:14px}
.pv-2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.pv.compact .pv-2{grid-template-columns:1fr}
.pv-bars{display:flex;flex-direction:column;gap:9px}
.pv-bar{display:grid;grid-template-columns:minmax(0,150px) 1fr 36px;gap:10px;align-items:center;font-size:13px}
.pv-bl{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.pv-bt{height:10px;background:color-mix(in srgb,var(--pfg) 6%,transparent);border-radius:4px;overflow:hidden}
.pv-bt i{display:block;height:100%;background:var(--p);border-radius:0 4px 4px 0}
.pv-bar b{text-align:right;font-variant-numeric:tabular-nums}
.pv-chips{display:flex;gap:6px;flex-wrap:wrap}
.pv-chip{border:1px solid var(--pline);background:var(--pcard);color:var(--pfg);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.pv-chip[aria-pressed="true"]{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent);font-weight:600}
.pv-inbox{display:grid;grid-template-columns:minmax(200px,290px) 1fr;border:1px solid var(--pline);border-radius:12px;background:var(--pcard);overflow:hidden;min-height:400px}
.pv.compact .pv-inbox{grid-template-columns:1fr}
.pv-list{border-right:1px solid var(--pline);display:flex;flex-direction:column;overflow:auto;max-height:540px;min-width:0}
.pv.compact .pv-list{max-height:230px;border-right:0;border-bottom:1px solid var(--pline)}
.pv-conv{border:0;border-bottom:1px solid var(--pline);background:transparent;color:inherit;text-align:left;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.pv-conv[aria-current="true"]{background:color-mix(in srgb,var(--p) 11%,transparent)}
.pv-conv b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-conv time{font-size:11.5px;color:var(--pmuted)}
.pv-conv .pv-prev{grid-column:2/4;font-size:12.5px;color:var(--pmuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-conv.unread b{font-weight:800}
.pv-conv.unread time{color:var(--pfg);font-weight:700}
.pv-thread{display:flex;flex-direction:column;gap:10px;padding:14px;min-width:0}
.pv-bub{max-width:82%;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--pfg) 7%,transparent);font-size:13.5px}
.pv-bub.me{align-self:flex-end;background:var(--p);color:var(--pfgon)}
.pv-bub small{display:block;opacity:.75;font-size:11px;margin-top:3px}
.pv-reply{margin-top:auto;border-top:1px solid var(--pline);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.pv-reply label{font-size:12px;color:var(--pmuted)}
.pv-btn.alt{background:transparent;color:var(--pfg);border:1px solid var(--pline)}
.pv-faq{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
.pv-faq .n{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;min-width:2ch}
.pv-faq .a{grid-column:2/4;font-size:13px;color:var(--pmuted)}
.ghost{min-height:560px;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);background:
  repeating-linear-gradient(0deg,transparent 0 23px,color-mix(in srgb,var(--line) 70%,transparent) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,color-mix(in srgb,var(--line) 70%,transparent) 23px 24px),var(--paper)}
.ghost h2{font-family:var(--f-display);color:var(--ink);font-size:26px;margin:0 0 8px;text-wrap:balance}
.ghost p{max-width:44ch;margin:0 auto}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .chat{border-right:0;border-bottom:1px solid var(--line)}
  .log{max-height:none}
  .stagebar,.canvas{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .pv.side{flex-direction:column}
  .pv-side{width:auto}
  .pv-side .pv-nav{flex-direction:row;overflow-x:auto}
  .pv-hero h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 23V3M22 23V3M4 8h18M4 15h18M4 8l18 7"/></g></svg>
      <b>Andamio</b><span>toda la presencia digital de tu organización, en un solo lugar</span>
    </div>
    <div class="sp"></div>
    <button class="badge" id="engineBadge" type="button" title="Cambiar motor"><i></i><span>Conectando IA…</span></button>
    <button class="tbtn" id="undoBtn" type="button" disabled>Deshacer</button>
    <button class="tbtn" id="resetBtn" type="button">Empezar de nuevo</button>
  </header>
  <main>
    <section class="chat" aria-label="Conversación">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Describe tu plataforma…"></textarea>
        <button class="send" type="submit">Enviar</button>
      </form>
    </section>
    <section class="stage" aria-label="Vista previa">
      <div class="stagebar">
        <div class="seg" role="group" aria-label="Vista">
          <button type="button" id="tabPrev" aria-pressed="true">Vista previa</button>
          <button type="button" id="tabPlan" aria-pressed="false">Plano</button>
        </div>
        <div class="seg" role="group" aria-label="Cara de la plataforma" id="faceSeg">
          <button type="button" id="faceCli" aria-pressed="true">Sitio para clientes</button>
          <button type="button" id="facePan" aria-pressed="false">Panel del negocio</button>
        </div>
        <div class="seg" role="group" aria-label="Dispositivo" id="devSeg">
          <button type="button" id="devDesk" aria-pressed="true">Escritorio</button>
          <button type="button" id="devMob" aria-pressed="false">Móvil</button>
        </div>
        <span class="note" id="stageNote"></span>
      </div>
      <div class="canvas" id="canvas"></div>
    </section>
  </main>
</div>

<script>

function detectDomain(t){
  t = t.toLowerCase();

  if (/restaur|caf[eé]|bar\b|cocina|comida|pizzer|sushi/.test(t)) return "resto";
  if (/colegio|escuela|jard[ií]n infantil|academia|liceo|universidad|preuniversitario|curso/.test(t)) return "edu";
  return "generic";
}
function guessName(t){
  let s = t.trim().replace(/[.!?]+$/,"");
  s = s.replace(/^.*?\bpara\s+(mi|mis|el|la|los|las|nuestro|nuestra|un|una)?\s*/i, "") || s;
  s = s.replace(/^(quiero|necesito|crear|hacer)\s+(una\s+)?(plataforma|app|p[aá]gina)\s*(de|del)?\s*/i, "");
  const small = new Set(["de","del","la","las","el","los","y","en","para"]);
  return s.split(/\s+/).filter(Boolean).slice(0,6).map((w,i) => (i && small.has(w.toLowerCase())) ? w.toLowerCase() : w[0].toUpperCase()+w.slice(1)).join(" ") || "Mi plataforma";
}
function shortName(n){

}
function initials(n){
  const w = (n||"?").split(/\s+/).filter(x=>!/^(de|del|la|el|y)$/i.test(x));
  return (w.length > 1 ? w[0][0] + w[w.length-1][0] : (w[0]||"?").slice(0,2)).toUpperCase();
}

/* Free-text commands that work at any moment ("menú lateral", "agrega galería", "verde y blanco") */
function applyCommand(t, commit){
  const s=t.toLowerCase(), ch=[], sp=commit?S.spec:clone(S.spec);
  const found=[]; Object.keys(COLOR_WORDS).forEach(w=>{ const i=s.indexOf(w); if(i>=0) found.push([i,w]); }); found.sort((a,b)=>a[0]-b[0]);
  const cols=found.map(f=>f[1]).filter(w=>w!=="blanco");
  if(cols.length){ sp.colors.primary=COLOR_WORDS[cols[0]]; if(cols[1]) sp.colors.accent=COLOR_WORDS[cols[1]]; else if(/blanco/.test(s)) sp.colors.accent="#FFFFFF"; ch.push("Colores: "+cols.slice(0,2).join(" y ")+(cols.length<2&&/blanco/.test(s)?" y blanco":"")); }
  if(/oscur|noche|dark/.test(s)){ sp.colors.surface="dark"; ch.push("Fondo oscuro"); }
  else if(/fondo claro|modo claro/.test(s)){ sp.colors.surface="light"; ch.push("Fondo claro"); }
  if(/men[uú].*(lateral|costado|izquierd)|(lateral|costado)/.test(s)){ sp.nav="side"; ch.push("Menú lateral"); }
  else if(/men[uú].*(abajo|inferior)|tipo app|como app/.test(s)){ sp.nav="bottom"; ch.push("Menú inferior (app)"); if(commit) setDevice("mob"); }
  else if(/men[uú].*(arriba|superior)/.test(s)){ sp.nav="top"; ch.push("Menú superior"); }
  const add=s.match(/(?:agrega|añade|suma|pon)(?:r)?\s+(?:una?\s+)?(?:secci[oó]n\s+(?:de\s+)?)?(.+)/);
  if(add){ const want=add[1].trim(); const c=D().catalog.find(x=>x.label.toLowerCase().includes(want)||want.includes(x.label.toLowerCase())||want.includes(x.type));
    const m=c?mod(c.type,c.label,c.desc):mod("lista",want[0].toUpperCase()+want.slice(1),"Sección personalizada"); sp.modules.push(m); ch.push("Agregué "+m.label); }
  const rm=s.match(/(?:quita|elimina|saca|borra)(?:r)?\s+(?:la\s+|el\s+)?(?:secci[oó]n\s+(?:de\s+)?)?(.+)/);
  if(rm){ const want=rm[1].trim(); const m=sp.modules.find(x=>x.label.toLowerCase().includes(want)||want.includes(x.label.toLowerCase())||want.includes(x.type)); if(m){ sp.modules=sp.modules.filter(x=>x!==m); ch.push("Quité "+m.label); } }
  const nm=t.match(/(?:ll[aá]mala|se llama|nombre(?: es)?:?)\s+["“]?([^"”]+)["”]?/i);
  if(nm){ sp.name=nm[1].trim(); ch.push("Nombre: "+sp.name); }
  return ch;
}

/* ---------- AI engine (Claude via the page's sample capability) ---------- */
const RULES = `Eres el motor de "Andamio", una plataforma que crea plataformas web a partir de lo que la persona describe en lenguaje natural. Hablas español de Chile, cercano y concreto.
Tu trabajo: conversar para definir la plataforma haciendo UNA pregunta por turno, con opciones concretas que la persona pueda aceptar o rechazar, y actualizar la especificación (spec) con cada respuesta. Cubre, en el orden que tenga sentido para el rubro: objetivo, perfiles de usuario, secciones del menú, números reales del negocio (ej. canchas, horarios, cupos, precios), colores, orientación del menú (top/side/bottom), qué se ve primero en la portada, el nombre, por qué canales la contacta la gente (WhatsApp, Instagram, Facebook, correo, llamadas, reseñas de Google, TikTok, chat web, apps de delivery) y qué hacer con las preguntas repetidas. La plataforma tiene dos caras: el sitio para clientes y el panel del negocio, con menú a la izquierda, que junta todos los canales en una bandeja unificada. Propón opciones específicas del rubro (un club de tenis tiene escalerilla, torneos, reservas de cancha, clases; no opciones genéricas).
Tras unas 8-10 preguntas, o si la persona dice que está listo, termina: "question": null y entrega "blindspots" con 3-5 cosas que podría estar olvidando (reglas, roles, pagos, legal, operación).
Si la persona pide un cambio directo ("menú lateral", "más oscuro", "agrega pro shop"), aplícalo en el spec y sigue con la pregunta pendiente.
Responde SOLO con un objeto JSON, sin texto alrededor:
{"say": "1-2 frases comentando lo que entendiste", "changes": ["frases cortas de lo que cambió en la plataforma"], "spec": SPEC, "question": {"text": "...", "hint": "...", "multi": true|false, "options": [{"label": "...", "selected": true|false, "swatch": ["#hex","#hex"]}]} | null, "blindspots": ["..."]}
SPEC = {"name": str, "tagline": str, "kind": str, "objective": str, "audiences": [str], "modules": [{"type": uno de ${TYPES.join("|")}, "label": str, "desc": str, "items": [str opcional, contenido de ejemplo]}], "colors": {"primary": "#RRGGBB", "accent": "#RRGGBB", "surface": "light"|"dark"}, "nav": "top"|"side"|"bottom", "cta": str, "facts": {"units": int opcional, "hours": [int,int] opcional, "surface": str opcional}, "stats": [{"label": str, "value": str}] (máx 4), "channels": [ids de ${Object.keys(CH).join("|")}], "autoreply": "auto"|"sugerir"|"ordenar"}
Reglas: máximo 8 módulos; entre 3 y 6 opciones por pregunta; usa "swatch" solo en preguntas de color; en preguntas multi marca "selected" lo que recomiendas; devuelve SIEMPRE el spec completo.`;

function aiPrompt(userText){
  const convo = S.log.slice(-16).map(m => m.who==="me" ? "PERSONA: "+m.text : "ANDAMIO: "+(m.text||"")+(m.question?` [preguntó: ${m.question.text} | opciones: ${m.question.options.map(o=>o.label).join(" / ")}]`:"")).join("\n");
  return `${RULES}\n\nSPEC ACTUAL:\n${JSON.stringify(stripIds(S.spec))}\n\nCONVERSACIÓN HASTA AHORA:\n${convo}\n\nÚLTIMO MENSAJE DE LA PERSONA:\n${userText}`;
}
function stripIds(sp){ const c=clone(sp); c.modules=c.modules.map(({id,...r})=>r); delete c.blindspots; delete c.domain; return c; }
const HEX=/^#[0-9a-f]{6}$/i;
function sanitize(sp){
  const base=emptySpec(), o=Object.assign(base, sp||{});
  o.name=String(o.name||S.spec.name||"Mi plataforma").slice(0,60);
  o.audiences=Array.isArray(o.audiences)?o.audiences.map(String).slice(0,8):[];
  o.modules=(Array.isArray(o.modules)?o.modules:[]).slice(0,8).map(m=>mod(TYPES.includes(m.type)?m.type:"lista", String(m.label||"Sección").slice(0,40), String(m.desc||""), Array.isArray(m.items)?m.items.map(String).slice(0,8):[]));
  const c=o.colors||{}; o.colors={primary:HEX.test(c.primary)?c.primary:S.spec.colors.primary, accent:HEX.test(c.accent)?c.accent:S.spec.colors.accent, surface:c.surface==="dark"?"dark":"light"};
  o.nav=["top","side","bottom"].includes(o.nav)?o.nav:"top";
  o.facts=o.facts&&typeof o.facts==="object"?o.facts:{};
  if(o.facts.hours && !(Array.isArray(o.facts.hours)&&o.facts.hours.length===2)) delete o.facts.hours;
  o.stats=Array.isArray(o.stats)?o.stats.slice(0,4).map(s=>({label:String(s.label||""),value:String(s.value??"")})):[];
  o.domain=S.spec.domain||detectDomain(o.kind||o.name);
  o.channels=Array.isArray(o.channels)?[...new Set(o.channels.filter(c=>CH[c]))]:(S.spec.channels||[]);
  o.autoreply=["auto","sugerir","ordenar"].includes(o.autoreply)?o.autoreply:(S.spec.autoreply||"sugerir");
  o.blindspots=[];
  return o;
}

    const prevNav=S.spec.nav, prevCh=JSON.stringify(S.spec.channels||[]), prevAuto=S.spec.autoreply;
    S.spec = sanitize(r.spec);
    if(JSON.stringify(S.spec.channels)!==prevCh && S.spec.channels.length){ S.face="panel"; S.apage="a_bandeja"; }
    else if(S.spec.autoreply!==prevAuto && S.spec.channels.length){ S.face="panel"; S.apage="a_faq"; }
    if(S.spec.nav==="bottom" && prevNav!=="bottom") setDevice("mob");
    if(!S.spec.modules.some(m=>m.id===S.page)) S.page="home";
    const q = r.question && Array.isArray(r.question.options) && r.question.options.length ? {
      text:String(r.question.text||""), hint:String(r.question.hint||""), multi:!!r.question.multi,
      options:r.question.options.slice(0,8).map(o=>({label:String(o.label||""), selected:!!o.selected, swatch:Array.isArray(o.swatch)?o.swatch.filter(x=>HEX.test(x)).slice(0,2):null}))} : null;
    const changes = Array.isArray(r.changes)?r.changes.map(String).slice(0,6):[];
    const blind = !q && Array.isArray(r.blindspots) ? r.blindspots.map(String).slice(0,6) : [];
    recordMap({said:userText, built:changes});
    S.log.push({who:"ai", text:String(r.say||""), changes, question:q, blind});
    S.question=q; S.spec.blindspots=blind;
  }catch(e){
    if(e && e.code==="cancelled"){ S.log.push({who:"ai", text:"Detenido. Puedes responder de nuevo o cambiar a modo guiado.", question:S.question}); }
    else {
      const hide = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e&&e.code);
      if(hide){ aiReady=false; }
      S.engine="local"; updateBadge();
      const msg = hide ? "La IA no está disponible en esta vista, así que sigo en modo guiado." : (e&&e.code==="rate_limited" ? "La IA está ocupada por ahora. Sigo en modo guiado; puedes volver a la IA en unos minutos." : "No pude leer la respuesta de la IA. Sigo en modo guiado.");
      if(!S.spec.kind){ localFlowAfterIdea(userText, msg); } else { const q=localNext(); S.question=q; S.log.push({who:"ai", text:msg, question:q, blind: q?[]:blindList()}); }
    }
  }finally{ busy=null; save(); renderAll(); }
}

/* ---------- Conversation flow ---------- */
function localFlowAfterIdea(text, prefix){
  const ch=localStart(text); deriveStats();
  recordMap({said:text, built:ch});
  const q=localNext(); S.question=q;
  S.log.push({who:"ai", text:(prefix?prefix+" ":"")+`Perfecto, armé un primer borrador para ${S.spec.name}. Míralo a la derecha; lo vamos afinando con cada respuesta.`, changes:ch, question:q});
}
function submit(sel, free){
  if(busy) return;
  free=(free||"").trim();
  const q=S.question;
  const labels = q ? sel.map(v => (q.options.find(o=>(o.value??o.label)==v)||{}).label || v) : [];
  let said = [labels.join(", "), free].filter(Boolean).join(". ");
  if(q && q.multi){ const rej=q.options.filter(o=>!sel.includes(o.value??o.label)).map(o=>o.label); if(rej.length && S.engine==="ai") said += (said?". ":"") + "No me interesa: " + rej.join(", "); }
  if(!said) return;
  snapshot();
  S.log.push({who:"me", text: said});
  if(S.engine==="ai" && aiReady){ save(); renderAll(); aiTurn(said); return; }
  if(!S.spec.kind){ localFlowAfterIdea(free || labels[0]); }
  else if(q && !(free && !sel.length && applyCommand(free).length && !["colors","name","units","hours","surface"].includes(q.key))){
    const step=FLOW[S.step]; let ch=step.apply(sel.map(String), free); deriveStats();
    const face={channels:"panel",autoreply:"panel",modules:"cliente",units:"cliente",hours:"cliente",nav:"cliente",home:"cliente",colors:S.face}[step.key]; if(face) S.face=face;
    recordMap({said, built:ch}); S.step++;
    const nq=localNext(); S.question=nq;
    S.log.push({who:"ai", text: nq ? pick(["Listo.","Hecho.","Anotado.","Perfecto."]) : `Listo, ${S.spec.name} tiene su primera versión. Recorre las secciones en la vista previa; puedes seguir pidiendo cambios aquí (ej. “menú lateral”, “agrega galería”, “colores verde y blanco”).`, changes:ch, question:nq, blind: nq?[]:blindList()});
  } else {
    const ch=applyCommand(free,true); deriveStats();
    recordMap({said, built:ch.length?ch:["Sin cambios"]});
    S.log.push({who:"ai", text: ch.length ? "Cambio aplicado." + (q ? " Seguimos con la pregunta pendiente." : "") : "No entendí ese cambio. Prueba con algo como “menú lateral”, “colores azul y amarillo” o “agrega tienda”.", changes:ch, question:q});
  }
  if(!S.spec.modules.some(m=>m.id===S.page)) S.page="home";
  save(); renderAll();
}
const pick = a => a[Math.floor(Math.random()*a.length)];

    h+=`<div class="msg ai"><div class="who">Andamio</div><p>Hola. Cuéntame qué organización quieres llevar a lo digital y para quién: armo su plataforma y junto en un panel todos sus canales (WhatsApp, Instagram, correo, llamadas, reseñas). Yo te voy proponiendo botones, secciones, colores y números, y tú aceptas o rechazas.</p>

  }

    if(m.changes&&m.changes.length) h+=`<div class="changes">${m.changes.map(c=>`<span class="chg">${esc(c)}</span>`).join("")}</div>`;
    if(last && m.question && !busy){
      const q=m.question;

        <div class="opts">${q.options.map(o=>`<button type="button" class="opt" data-v="${esc(o.value??o.label)}" aria-pressed="${q.multi&&o.selected?"true":"false"}">${o.swatch&&o.swatch.length?`<span class="sw">${o.swatch.map(c=>`<i style="background:${c}"></i>`).join("")}</span>`:""}${esc(o.label)}</button>`).join("")}</div>
        <div class="qrow">${q.multi?`<button type="button" class="go" id="qGo">Confirmar selección</button>`:""}<button type="button" class="skip" id="qSkip">Saltar esta pregunta</button></div></div>`;
    }
    if(m.blind&&m.blind.length) h+=`<div class="blind"><b>Podrías estar olvidando</b><ul>${m.blind.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`;
    h+=`</div>`;
  });
  if(busy) h+=`<div class="msg ai"><div class="who">Andamio</div><div class="think"><span class="dots"><i></i><i></i><i></i></span>Pensando la siguiente propuesta… <button type="button" class="skip" id="stopBtn">Detener</button></div></div>`;
  el.innerHTML=h; el.scrollTop=el.scrollHeight;
  const inp=$("#input");
  inp.placeholder = !S.spec.kind ? "Describe tu plataforma…" : S.question ? (S.question.multi ? "Agrega otra opción o pide un cambio…" : "Escribe otra respuesta o pide un cambio…") : "Pide un cambio (ej. menú lateral)…";
}

});

      listCards([["Octubre","Pagado el 05/10 · "+clp(amt),"Al día"],["Septiembre","Pagado el 03/09 · "+clp(amt),"Al día"],[isClub()?"Iluminación nocturna":"Cargo adicional","4 horas · "+clp(isClub()?12000:5000),"Pagado"]]); },
  noticias(m){ return listCards(fromItems(m, isClub()?[["Nuevo horario de iluminación","Las canchas 1 a 4 quedan iluminadas hasta las 23:00.","Hace 2 días"],["Resultados Torneo de Otoño","Revisa los campeones de cada categoría.","Hace 1 semana"],["Mantención cancha 3","Cerrada el lunes por recarga de arcilla.","Aviso"]]:[["Bienvenidos a la nueva plataforma","Desde ahora todo se gestiona aquí.","Hoy"],["Cambio de horario","Atención extendida en diciembre.","Aviso"],["Próximo evento","Reserva la fecha.","Pronto"]])); },
  tienda(m){ const it = m.items&&m.items.length ? m.items.map((x,i)=>[x,clp(9990+i*5000),"Agregar"]) : (isClub()?[["Tubo de pelotas","",clp(6990)],["Encordado","Entrega en 24 h",clp(15000)],["Grip overgrip x3","",clp(5990)],["Raqueta de arriendo","Por hora",clp(3000)]]:S.spec.domain==="resto"?[["Plato del día","Con postre",clp(8900)],["Pastel de choclo","",clp(10900)],["Ceviche","",clp(9500)],["Pisco sour","",clp(4900)]]:[["Producto A","",clp(19990)],["Producto B","",clp(29990)],["Servicio C","Por sesión",clp(25000)]]);
    return listCards(it); },
  socios(){ return `<div class="pv-card" style="max-width:420px"><div class="pv-row"><b>Socio de ejemplo</b><span class="pv-tag">Al día</span></div><span>N° ${isClub()?"socio":"cuenta"} 01482 · Desde 2019</span><span>Grupo familiar: 3 personas</span><span>Correo y teléfono verificados</span></div>`; },
  galeria(){ return `<div class="pv-gal">${Array.from({length:6},(_,i)=>`<div style="background:linear-gradient(${30+i*40}deg,var(--p),var(--a))"></div>`).join("")}</div>`; },
  agenda(m){ return listCards(fromItems(m,[["Lunes 10","Reunión general · 19:00","Agenda"],["Miércoles 12","Actividad abierta · 18:30","Inscripción"],["Sábado 15","Jornada especial · 10:00","Destacado"]])); },
  contacto(){ return `<div class="pv-grid"><div class="pv-card"><b>Dirección</b><span>Providencia, Santiago (por definir)</span><b>Horario</b><span>Lunes a domingo</span></div><div class="pv-card"><b>Escríbenos</b><input class="pv-input" placeholder="Tu correo" tabindex="-1"><textarea class="pv-input" rows="3" placeholder="Mensaje" tabindex="-1"></textarea><button type="button" class="pv-btn" tabindex="-1">Enviar</button></div></div>`; },
  dashboard(){ return `<div class="pv-stats">${[["Reservas hoy","18"],["Usuarios activos","342"],["Pagos pendientes","27"],["Mensajes","6"]].map(s=>`<div class="pv-stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div>`; },
  lista(m){ return listCards(m.items&&m.items.length?m.items.map(x=>[x]):[["Primer elemento","Aquí va el contenido de esta sección"],["Segundo elemento",""],["Tercer elemento",""]]); }
};

/* ---------- Business panel: left menu, dashboard, unified inbox, channel tabs, FAQ, connections ---------- */
const chBadge = id => { const c=CH[id]; return c ? `<span class="chb" style="background:${c.c}" title="${esc(c.label)}">${esc(c.s)}</span>` : ""; };
function convos(){ const on=new Set(S.spec.channels||[]); return CONVOS[dom3()].map((c,i)=>Object.assign({i},c)).filter(c=>on.has(c.ch)); }
const isUnread = c => c.unread && !S.inbox.read.includes(c.i);
function adminNav(){
  const sp=S.spec, chs=sp.channels||[], cs=convos();
  return [
    {g:"General", items:[{id:"a_resumen",label:"Resumen",ic:"dashboard"},{id:"a_bandeja",label:"Bandeja unificada",ic:"inbox",badge:cs.filter(isUnread).length},{id:"a_faq",label:"Lo que preguntan",ic:"faq"}]},
    {g:"Canales", items:chs.map(c=>({id:"ch_"+c,label:CH[c].label,ch:c,badge:cs.filter(x=>x.ch===c&&isUnread(x)).length}))},
    {g:"Negocio", items:sp.modules.map(m=>({id:m.id,label:m.label,ic:m.type}))},
    {g:"Ajustes", items:[{id:"a_conexiones",label:"Conexiones",ic:"plug"}]}
  ].filter(g=>g.items.length);
}
function renderPanel(c, style, logo){
  const sp=S.spec, compact=device==="mob", nav=adminNav();
  if(!nav.some(g=>g.items.some(it=>it.id===S.apage))) S.apage="a_resumen";
  const navHtml=nav.map(g=>`<div class="pv-g">${compact?"":`<span class="pv-gl">${g.g}</span>`}${g.items.map(it=>`<button type="button" data-apage="${it.id}" ${S.apage===it.id?'aria-current="page"':""}>${it.ch?chBadge(it.ch):icon(it.ic)}<span>${esc(it.label)}</span>${it.badge?`<em class="pv-cnt">${it.badge}</em>`:""}</button>`).join("")}</div>`).join("");
  const top=`<div class="pv-row pv-topbar"><input class="pv-input" style="max-width:340px" placeholder="Buscar conversaciones, clientes, reservas…" tabindex="-1" aria-label="Buscar"><span class="pv-ex">Panel del negocio · Administración</span></div>`;
  const slug=(sp.name||"plataforma").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  c.innerHTML=`<div class="device ${device}"><div class="chrome"><i></i><i></i><i></i><span class="url">panel.${esc(slug)}.andamio.app/${esc(S.apage.replace(/^(a_|ch_)/,""))}</span></div>
    <div class="pv side ${compact?"compact":""}" style="${style}"><aside class="pv-side">${logo}<nav class="pv-nav" aria-label="Menú del panel">${navHtml}</nav></aside><div class="pv-body">${top}${adminPage()}</div></div></div>`;
  const n=(sp.channels||[]).length;
  $("#stageNote").textContent = n ? `${n} canales en una bandeja · menú lateral` : "Sin canales conectados todavía";
}
function adminPage(){
  const sp=S.spec, chs=sp.channels||[], cs=convos(), p=S.apage;
  const h=(t,s)=>`<div><h2 class="pv-h2">${esc(t)}</h2></div>${s?`<p class="pv-sub">${esc(s)}</p>`:""}`;
  const ex=`<span class="pv-ex">Mensajes y cifras de ejemplo: al conectar cada canal aparecen los reales.</span>`;
  const tiles=a=>`<div class="pv-stats">${a.map(s=>`<div class="pv-stat"><b>${esc(s[1])}</b><span>${esc(s[0])}</span></div>`).join("")}</div>`;
  if(p==="a_resumen"){
    if(!chs.length) return h("Resumen")+`<div class="pv-card"><b>Todavía no conectas canales</b><span>Conecta WhatsApp, Instagram, correo y los demás para ver todo en un solo lugar.</span><button type="button" class="pv-btn" data-apage="a_conexiones" style="align-self:flex-start">Ir a Conexiones</button></div>`;
    const total=chs.reduce((s,k)=>s+(CH_TODAY[k]||0),0), unread=cs.filter(isUnread).length;
    const k=[["Mensajes hoy",String(total)],["Sin responder",String(unread)],["Respuesta promedio",sp.autoreply==="auto"?"1 min":"7 min"],[sp.domain==="club"?"Reservas de cancha hoy":sp.domain==="resto"?"Mesas reservadas hoy":"Citas hoy",sp.domain==="club"?"18":sp.domain==="resto"?"23":"9"]];
    if(chs.includes("google")) k[3]=["Nota en Google","4,6"];
    const rows=[...chs].sort((a,b)=>(CH_TODAY[b]||0)-(CH_TODAY[a]||0)), max=Math.max(...rows.map(r=>CH_TODAY[r]||0),1);
    const faqs=FAQS[dom3()];
    return h("Resumen de hoy", "Todo lo que llegó por tus canales, en un solo vistazo.")+tiles(k)+
      `<div class="pv-2"><div class="pv-card" style="gap:12px"><b>Mensajes por canal, hoy</b><div class="pv-bars">${rows.map(r=>`<div class="pv-bar" title="${esc(CH[r].label)}: ${CH_TODAY[r]} mensajes hoy"><span class="pv-bl">${chBadge(r)}<span>${esc(CH[r].label)}</span></span><span class="pv-bt"><i style="width:${(CH_TODAY[r]||0)/max*100}%"></i></span><b>${CH_TODAY[r]||0}</b></div>`).join("")}</div></div>
      <div class="pv-card" style="gap:10px"><div class="pv-row"><b>Lo que más preguntan</b><button type="button" class="pv-chip" data-apage="a_faq">Ver todo</button></div>${faqs.slice(0,3).map(f=>`<div class="pv-row"><span>${esc(f.q)}</span><b style="font-variant-numeric:tabular-nums">${f.n}</b></div>`).join("")}</div></div>
      <div class="pv-card" style="gap:4px;padding:6px 0"><b style="padding:8px 14px">Últimos mensajes</b>${cs.slice(0,4).map(cv=>convRow(cv,false)).join("")}</div>`+ex;
  }
  if(p==="a_bandeja") return h("Bandeja unificada", "WhatsApp, Instagram, correo, llamadas y reseñas en una sola lista. Respondes desde aquí y sale por el canal original.")+inboxHTML(null)+ex;
  if(p.startsWith("ch_")){
    const id=p.slice(3), c=CH[id]; if(!c) return "";
    const un=cs.filter(x=>x.ch===id&&isUnread(x)).length;
    const st={google:[["Nota promedio","4,6"],["Reseñas este mes","27"],["Sin responder",String(un)]],
      llamadas:[["Llamadas hoy",String(CH_TODAY.llamadas)],["Perdidas","2"],["Duración promedio","2:48"]],
      instagram:[["Mensajes hoy",String(CH_TODAY.instagram)],["Comentarios esta semana","31"],["Sin responder",String(un)]],
      whatsapp:[["Conversaciones hoy",String(CH_TODAY.whatsapp)],["Sin responder",String(un)],["Respuesta promedio",sp.autoreply==="auto"?"1 min":"6 min"]]}[id]
      || [["Mensajes hoy",String(CH_TODAY[id]||0)],["Sin responder",String(un)],["Respuesta promedio","9 min"]];
    return h(c.label, c.what)+tiles(st)+inboxHTML(id)+ex;
  }
  if(p==="a_faq"){
    const mode={auto:"Se responde sola",sugerir:"Sugerida, tú apruebas",ordenar:"Solo agrupada"}[sp.autoreply||"sugerir"];
    return h("Lo que preguntan", "Las preguntas que más se repiten en todos tus canales esta semana, agrupadas por tema.")+
      `<div class="pv-row"><span class="pv-tag">Modo: ${esc(mode)}</span><span class="pv-ex">Canales: ${chs.map(chBadge).join(" ")||"ninguno"}</span></div>`+
      `<div class="pv-card" style="gap:14px">${FAQS[dom3()].map((f,i)=>{ const on=!S.faqOff.includes(i);
        return `<div class="pv-faq"><span class="n">${f.n}</span><b>${esc(f.q)}</b><button type="button" class="pv-chip" data-faq="${i}" aria-pressed="${on}">${on?(sp.autoreply==="ordenar"?"Agrupando":"Respuesta activa"):"Desactivada"}</button><span class="a">${esc(f.a)}</span></div>`; }).join("")}</div>`+ex;
  }
  if(p==="a_conexiones"){
    const list=CH_BY_DOMAIN[sp.domain]||CH_BY_DOMAIN.generic;
    return h("Conexiones", "Conecta cada canal una vez y todo llega al panel.")+
      `<div class="pv-grid">${list.map(id=>{ const on=chs.includes(id); return `<div class="pv-card"><div class="pv-row">${chBadge(id)}<span class="pv-tag">${on?"Conectado":"Sin conectar"}</span></div><b>${esc(CH[id].label)}</b><span>${esc(CH[id].what)}</span><button type="button" class="pv-btn ${on?"alt":""}" data-connect="${id}" style="align-self:flex-start">${on?"Desconectar":"Conectar"}</button></div>`; }).join("")}</div>
      <span class="pv-ex">Prototipo: conectar es simulado. En la versión real se usan las conexiones oficiales de cada servicio (Meta para WhatsApp, Instagram y Facebook; Google; Gmail u Outlook; un proveedor de telefonía).</span>`;
  }
  const m=sp.modules.find(x=>x.id===p); if(!m) return "";
  return h(m.label, m.desc)+(R[m.type]||R.lista)(m)+`<span class="pv-ex">Contenido de ejemplo: se reemplaza por tus datos reales.</span>`;
}
function convRow(cv, inList){
  const last=(S.inbox.sent[cv.i]||[]).slice(-1)[0];
  return `<button type="button" class="pv-conv ${isUnread(cv)?"unread":""}" data-conv="${cv.i}" ${inList&&S.inbox.sel===cv.i?'aria-current="true"':""}>${chBadge(cv.ch)}<b>${esc(cv.who)}</b><time>${esc(cv.time)}</time><span class="pv-prev">${S.inbox.done.includes(cv.i)?"Resuelta · ":""}${last?"Tú: "+esc(last):esc(cv.msgs[cv.msgs.length-1])}</span></button>`;
}
function inboxHTML(fix){
  const f=fix||S.inbox.filter, all=convos(), chs=S.spec.channels||[];
  const cs = f==="all" ? all : all.filter(c=>c.ch===f);
  const chips = fix ? "" : `<div class="pv-chips"><button type="button" class="pv-chip" data-filter="all" aria-pressed="${f==="all"}">Todos · ${all.length}</button>${chs.map(k=>`<button type="button" class="pv-chip" data-filter="${k}" aria-pressed="${f===k}">${chBadge(k)}${esc(CH[k].label)}</button>`).join("")}</div>`;
  if(!cs.length) return chips+`<div class="pv-card"><b>No hay mensajes aquí todavía</b><span>Cuando llegue algo por este canal, aparece en esta lista.</span></div>`;
  let sel=cs.find(c=>c.i===S.inbox.sel); if(!sel){ sel=cs[0]; S.inbox.sel=sel.i; }
  const sent=S.inbox.sent[sel.i]||[], draft=S.inbox.draft[sel.i];
  const val = draft!=null && draft!=="" ? draft : (sent.length ? "" : sel.reply);
  const aiOk = !!(sampleFn && aiReady);
  const label = S.spec.autoreply==="auto" ? "Respuesta preparada por la IA (se envía sola si es pregunta frecuente)" : S.spec.autoreply==="ordenar" ? "Tu respuesta" : "Respuesta sugerida: revísala y envíala";
  return chips+`<div class="pv-inbox"><div class="pv-list" role="list">${cs.map(cv=>convRow(cv,true)).join("")}</div>
    <div class="pv-thread"><div class="pv-row"><div style="display:flex;gap:8px;align-items:center;min-width:0">${chBadge(sel.ch)}<b>${esc(sel.who)}</b></div><span class="pv-tag">${esc(sel.tag)}</span></div>
      ${sel.msgs.map(t=>`<div class="pv-bub">${esc(t)}<small>${esc(sel.time)} · ${esc(CH[sel.ch].label)}</small></div>`).join("")}
      ${sent.map(t=>`<div class="pv-bub me">${esc(t)}<small>Enviado · ${esc(CH[sel.ch].send.replace(/^(Enviar|Responder|Publicar|Devolver)\s*/,""))}</small></div>`).join("")}
      <div class="pv-reply"><label for="pvReply">${esc(label)}</label><textarea class="pv-input" id="pvReply" rows="3">${esc(val)}</textarea>
        <div class="pv-row" style="justify-content:flex-start;gap:8px"><button type="button" class="pv-btn" id="pvSend">${esc(CH[sel.ch].send)}</button>${aiOk?`<button type="button" class="pv-btn alt" id="pvAI">Redactar con IA</button>`:""}<button type="button" class="pv-btn alt" id="pvDone">${S.inbox.done.includes(sel.i)?"Reabrir":"Marcar resuelta"}</button></div></div>
    </div></div>`;
}
async function draftAI(i, btn){
  const c=CONVOS[dom3()][i], ta=$("#pvReply"); if(!sampleFn||!ta||!c) return;
  btn.disabled=true; btn.textContent="Redactando…";
  try{
    const {text}=await sampleFn(`Respondes los mensajes de "${S.spec.name}" (${S.spec.kind}). Escribe UNA respuesta breve (máximo 2 frases), cálida y concreta, en español de Chile, para este mensaje que llegó por ${CH[c.ch].label} de ${c.who}: "${c.msgs.join(" ")}". Datos del negocio que puedes usar: ${JSON.stringify({secciones:S.spec.modules.map(m=>m.label), datos:S.spec.facts})}. Si te falta un dato, ofrece confirmarlo. Responde solo con el texto del mensaje.`,
      {modelTier:"quick", cache:false, onText:({text})=>{ const t=$("#pvReply"); if(t) t.value=text; }});
    S.inbox.draft[i]=text.trim(); save();
  }catch(e){ if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e&&e.code)){ aiReady=false; updateBadge(); } }
  finally{ renderStage(); }
}

function planHTML(){
  const sp=S.spec;
  return `<div class="plan"><div><h2>Plano de ${esc(sp.name||"tu plataforma")}</h2><p class="lead">Cada pedido guarda una versión nueva: qué dijiste, qué se construyó y cuándo. Esta especificación es la que después se construye de verdad.</p></div>
    <div class="pv-row" style="gap:10px"><h2 style="font-size:18px">Historial de versiones</h2>${S.versions.length?`<button type="button" class="tbtn" id="copyLog">Copiar registro</button>`:""}</div>
    ${S.versions.length?`<div style="overflow-x:auto"><table class="maptbl"><thead><tr><th>Versión</th><th>Lo que dijiste</th><th>Lo que se construyó</th><th></th></tr></thead><tbody>${[...S.versions].reverse().map((v,i)=>`<tr><td style="width:auto;font-style:normal;white-space:nowrap"><b>v${v.n}</b>${i===0?' <span class="chg" style="background:transparent">actual</span>':""}<br><span style="color:var(--muted);font-size:12px">${esc(fmtTime(v.at))}</span></td><td>“${esc(v.said)}”</td><td>${v.built.map(b=>`<span class="chg">${esc(b)}</span>`).join(" ")}</td><td>${i===0?"":`<button type="button" class="tbtn" data-restore="${v.n}">Restaurar</button>`}</td></tr>`).join("")}</tbody></table></div>`:`<p class="lead">Todavía no hay versiones. Cada respuesta que des guarda una versión nueva de la plataforma, y puedes volver a cualquiera.</p>`}
    <div class="pv-row" style="gap:10px"><h2 style="font-size:18px">Especificación (JSON)</h2><button type="button" class="tbtn" id="copyJson">Copiar JSON</button></div>
    <pre class="json" id="jsonPre">${esc(JSON.stringify(stripIds(sp),null,2))}</pre>
    <p class="lead" style="font-family:var(--f-mono);font-size:12px">Andamio v${APP_VERSION}</p></div>`;
}

/* ---------- Header controls ---------- */
function updateBadge(){
  const b=$("#engineBadge"), on=S.engine==="ai"&&aiReady;
  b.classList.toggle("on", on);
  b.querySelector("span").textContent = on ? "IA conectada (Claude)" : aiReady ? "Modo guiado · toca para usar IA" : "Modo guiado";
  b.disabled = !aiReady;
}
$("#engineBadge").addEventListener("click", ()=>{ if(!aiReady) return; S.engine = S.engine==="ai" ? "local" : "ai"; aiWanted = S.engine==="ai";
  if(S.engine==="local" && S.spec.kind && !S.question){ S.step=Math.min(S.step,FLOW.length); }
  save(); updateBadge(); });
$("#undoBtn").addEventListener("click", ()=>{ if(busy||!undo.length) return; S=Object.assign(fresh(), JSON.parse(undo.pop())); $("#undoBtn").disabled=!undo.length; save(); renderAll(); });
$("#resetBtn").addEventListener("click", ()=>{ if(busy) busy.abort(); const eng=S.engine; S=fresh(); S.engine=eng; undo.length=0; $("#undoBtn").disabled=true; save(); renderAll(); });
$("#tabPrev").addEventListener("click", ()=>{ view="prev"; $("#tabPrev").setAttribute("aria-pressed","true"); $("#tabPlan").setAttribute("aria-pressed","false"); renderStage(); });
$("#tabPlan").addEventListener("click", ()=>{ view="plan"; $("#tabPlan").setAttribute("aria-pressed","true"); $("#tabPrev").setAttribute("aria-pressed","false"); renderStage(); });
$("#devDesk").addEventListener("click", ()=>{ setDevice("desk"); renderStage(); });
$("#devMob").addEventListener("click", ()=>{ setDevice("mob"); renderStage(); });
$("#faceCli").addEventListener("click", ()=>{ S.face="cliente"; save(); renderStage(); });
$("#facePan").addEventListener("click", ()=>{ S.face="panel"; save(); renderStage(); });
$("#canvas").addEventListener("input", e=>{ if(e.target.id==="pvReply" && S.inbox.sel!=null){ S.inbox.draft[S.inbox.sel]=e.target.value; save(); } });

function renderAll(){ renderLog(); renderStage(); updateBadge(); }
if(S.spec.nav==="bottom") setDevice("mob");
renderAll();

/* Light up the AI engine if this view can ask Claude */
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("sample").then(fn=>{ sampleFn=fn; aiReady=!!fn; if(aiReady && aiWanted && !S.log.length) S.engine="ai"; else if(aiReady && S.engine!=="ai") S.engine="local"; updateBadge(); }).catch(()=>{ aiReady=false; updateBadge(); });
} else { updateBadge(); }
})();
</script>
